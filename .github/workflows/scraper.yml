name: Precise Game Config & Controls Auto Scraper

on:
  schedule:
    - cron: '0 2 * * *' # يعمل تلقائياً كل يوم الساعة 2 صباحاً
  workflow_dispatch: # إمكانية التشغيل اليدوي بضغطة زر من GitHub

permissions:
  contents: write # إعطاء صلاحيات الكتابة والدفع إلى المستودع

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install & Start Tor Proxy Service
        run: |
          sudo apt-get update
          sudo apt-get install -y tor
          sudo service tor start
          sleep 5

      - name: Install Python Stealth Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4

      - name: Run Master Scraper Script
        run: python scraper.py

      - name: Commit and Push New Configurations
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/
          
          # التحقق مما إذا كانت هناك ملفات جديدة تم العثور عليها قبل إجراء الحفظ
          if git status --porcelain | grep -q 'configs/'; then
            git commit -m "Auto-update verified game controls & config files from live sources"
            git push
          else
            echo "No new original files discovered in this run."
          fi

