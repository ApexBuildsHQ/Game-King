name: Auto Game Codes Scraper

on:
  schedule:
    # تشغيل السكربت تلقائياً كل ساعتين
    - cron: '0 */3 * * *'
  # إمكانية تشغيل السكربت يدوياً من GitHub بنقرة زر
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scraper Engine
        run: python main.py

      - name: Commit and Push Updated codes.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add codes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update codes.json [skip ci]" && git push)

