name: Game Codes Scraper

on:
  schedule:
    - cron: '0 0 * * *'  # يعمل تلقائياً كل يوم الساعة 12 منتصف الليل
  workflow_dispatch:     # يتيح لك إمكانية التشغيل اليدوي بضغطة زر من GitHub

jobs:
  run-scraper-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Scraper Script
        run: python scripts/scraper.py

      - name: Commit and Push Updated Json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/codes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update game codes [skip ci]" && git push)

