name: Scrape and Update Game Configurations

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install & Start Tor Proxy Service
        run: |
          sudo apt-get update
          sudo apt-get install -y tor
          sudo service tor start
          sleep 3

      - name: Install Python Stealth Dependencies
        run: |
          pip install beautifulsoup4 curl_cffi

      - name: Run Master Scraper Script
        run: |
          python scraper.py

      - name: Commit and Push New Configurations
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # إنشائه احتياطياً لمنع fatal: pathspec 'configs/' did not match any files
          mkdir -p configs/
          
          git add configs/
          
          # التحقق من وجود تغييرات حقيقية قبل تنفيذ الـ commit
          if [ -n "$(git status --porcelain configs/)" ]; then
            git commit -m "Auto-update verified game controls & config files from live sources"
            git push
          else
            echo "No new original files discovered in this run."
          fi

