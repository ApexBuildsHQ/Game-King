name: Daily Game Codes Scraper

on:
  schedule:
    # يعمل تلقائياً يومياً الساعة 12 ظهراً بتوقيت UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # يتيح لك تشغيل السكربت يدوياً بأي وقت من تبويب Actions

permissions:
  contents: write # صلاحية رفع التعديلات وإجراء Commit للمستودع

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python scripts/fetch_codes.py # غير اسم الملف هنا إذا كان اسم ملف البايثون مختلفاً لديك

      - name: Commit and Push Game Codes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add codes.json
          git commit -m "Auto-update game codes [skip ci]" || exit 0
          git push

