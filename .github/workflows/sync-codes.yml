name: Sync Game Codes Automatically

on:
  schedule:
    # التشغيل التلقائي مرتين يومياً (الساعة 00:00 و 12:00 بتوقيت UTC)
    - cron: '0 0,12 * * *'
  
  # السماح بتشغيل السكريبت يدوياً من تبويب Actions في GitHub
  workflow_dispatch:

permissions:
  contents: write # منح صلاحيات الحفظ والتعديل داخل المستودع

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة بيثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. تثبيت المكتبات المطلوبة
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      # 4. تشغيل سكريبت السحب والفلترة
      - name: Run Main Scraper
        run: python main.py

      # 5. حفظ وحفظ الملف المحدث (clean_codes.json) في المستودع
      - name: Commit and Push Updated Codes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add clean_codes.json
          
          # التحقق مما إذا كان هناك تغيير في الملفات قبل إجراء Commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 auto: update clean game codes [skip ci]" && git push)

