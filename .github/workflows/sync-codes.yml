name: Auto Fetch Game Codes

on:
  schedule:
    - cron: '0 */8 * * *' # يعمل أوتوماتيكياً كل 8 ساعات
  workflow_dispatch: # يتيح التشغيل اليدوي بنقرة زر في أي وقت

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 genshin

      - name: Ensure Output Directory Exists
        run: mkdir -p data

      - name: Execute Scraper Script
        run: python scripts/fetch_codes.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "CodeSyncBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/codes.json
          git commit -m "Auto-update game codes database [skip ci]" || exit 0
          git push

