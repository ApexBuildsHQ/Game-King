name: Daily Game Codes Sync

on:
  schedule:
    # يعمل تلقائياً كل يوم الساعة 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # يتيح لك تشغيل السكربت يدوياً بنقرة زر من GitHub

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Code Extractor Script
        run: python scripts/fetch_codes.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add codes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update game codes [skip ci]" && git push)
