name: Daily Game Codes Scraper

on:
  schedule:
    # يعمل يومياً الساعة 12 ظهراً بتوقيت UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper
        run: python scripts/fetch_codes.py

      - name: Commit and Push Clean Codes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add clean_codes.json
          git commit -m "Auto-update clean game codes [skip ci]" || exit 0
          git push

