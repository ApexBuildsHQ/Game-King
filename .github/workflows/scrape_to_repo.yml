name: Scrape Game Configs To Repo

on:
  workflow_dispatch:

permissions: write-all

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Scraper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/scrape_configs.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add controls/ settings/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-scraped game controls (.ic/.json) and container settings [skip ci]" && git push)

