name: Scrape Game Configs To Repo

on:
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute GitHub Configs Scraper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/scrape_configs.py

      - name: Commit and Push Downloaded Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add controls/ settings/
          
          # يتأكد من وجود تغييرات جديدة قبل عمل Commit لمنع إيقاف السلسلة
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-scraped game controls and container settings [skip ci]" && git push)

