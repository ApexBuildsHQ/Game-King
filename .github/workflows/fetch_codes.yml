name: Run Game Codes Scraper

on:
  schedule:
    # تشغيل تلقائي كل 12 ساعة (الساعة 12 صباحاً و12 مساءً بتوقيت UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # يتيح لك تشغيل السكربت يدوياً بنقرة زر من GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    # إعطاء صلاحية الكتابة لإعادة رفع ملف codes.json إلى المستودع
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Execute Scraper Script
        run: python scripts/fetch_codes.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "CodeSyncBot"
          git config --global user.email "actions@github.com"
          git add data/codes.json
          # التاكد من وجود تغييرات حقيقية قبل عمل Commit لمنع الأخطاء
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update game codes database [skip ci]" && git push)

