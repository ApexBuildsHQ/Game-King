name: Sync & Update Game Codes Engine

on:
  schedule:
    - cron: '0 */3 * * *' # يعمل تلقائياً كل 6 ساعات
  workflow_dispatch: # إمكانية التشغيل اليدوي بزر واحد من GitHub

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 llama-cpp-python

      - name: Run Master Engine
        run: |
          python scripts/engine.py

      - name: Commit and Push Changes (If New Data Found)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/
          if git status --porcelain | grep -E 'public/data/'; then
            git commit -m "🤖 [BOT] Update game codes and index"
            git push
          else
            echo "No changes detected in game codes."
          fi
